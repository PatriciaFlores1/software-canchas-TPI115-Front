<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Canchas SV</title>

  <!-- Tipografía Nunito Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="/public/libs/bootstrap/css/bootstrap.min.css">

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="/public/assets/css/style.css">
</head>
<body class="registro-page">

  <!-- NAVBAR -->
  <div id="navbar-container"></div>

  <!-- FORMULARIO DE REGISTRO -->
  <section class="auth-section cambiar d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card registro-card p-4 shadow-sm border-0">
            <h3 class="text-center fw-bold mb-3">Crear tu Cuenta</h3>
            <p class="text-center text-muted mb-4">
              ¿Ya tienes una cuenta?
              <a href="#" class="text-decoration-none text-primary">Inicia Sesión</a>
            </p>

            <form id="registroForm" novalidate>
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" required>
              </div>

              <div class="mb-3">
                <label for="apellido" class="form-label">Apellido <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="apellido" name="apellido" placeholder="Tu apellido" required>
              </div>

              <div class="mb-3">
                <label for="correo" class="form-label">Correo Electrónico <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="correo" name="email" placeholder="ejemplo@correo.com" required>
              </div>

              <div class="mb-3">
                <label for="telefono" class="form-label">Número de Teléfono</label>
                <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Ej. +503 7000 0000">
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Contraseña <span class="text-danger">*</span></label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Ingresa tu contraseña" required>
              </div>

              <div class="mb-3">
                <label for="confirmar" class="form-label">Confirmar Contraseña <span class="text-danger">*</span></label>
                <input type="password" class="form-control" id="confirmar" placeholder="Repite tu contraseña" required>
              </div>

              <div class="d-flex justify-content-between mb-4">
                <button type="button" id="btn-propietario" class="btn btn-outline-secondary w-50 me-2">Propietario</button>
                <button type="button" id="btn-cliente" class="btn btn-outline-secondary w-50">Cliente</button>
              </div>

              <!-- Valores enviados al backend -->
              <input type="hidden" id="id_rol" name="id_rol" value="1">
              <input type="hidden" id="id_estado" name="id_estado" value="1">

              <button type="submit" class="btn btn-primary w-100">Registrarse</button>

              <p class="text-center mt-3 text-muted" style="font-size: 0.9rem;">
                Al registrarte, aceptas nuestros
                <a href="#" class="text-decoration-none text-primary">Términos de Servicio</a> y
                <a href="#" class="text-decoration-none text-primary">Política de Privacidad</a>.
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <div id="footer-container"></div>

  <!-- JS -->
  <script src="/public/libs/jquery/jquery.min.js"></script>
  <script src="/public/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/public/assets/js/main.js"></script>
  <script>
    // Script para manejar el registro vía fetch a la API
    (function() {
      const form = document.getElementById('registroForm');
      const btnProp = document.getElementById('btn-propietario');
      const btnCli = document.getElementById('btn-cliente');
      const inputRol = document.getElementById('id_rol');

      // Mapear roles: 1=Admin, 2=Cliente, 3=Propietario
      // Al registrar desde la UI, Cliente debe ser id 2 y Propietario id 3
      function setRole(roleId) {
        inputRol.value = String(roleId);
        if (roleId === 3) {
          // Propietario seleccionado
          btnProp.classList.remove('btn-outline-secondary');
          btnProp.classList.add('btn-primary');
          btnCli.classList.remove('btn-primary');
          btnCli.classList.add('btn-outline-secondary');
        } else {
          // Cliente seleccionado (u otro)
          btnCli.classList.remove('btn-outline-secondary');
          btnCli.classList.add('btn-primary');
          btnProp.classList.remove('btn-primary');
          btnProp.classList.add('btn-outline-secondary');
        }
      }

      // Set valor por defecto: cliente (id_rol = 2)
      setRole(2);

      btnProp.addEventListener('click', () => setRole(3));
      btnCli.addEventListener('click', () => setRole(2));

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const nombre = document.getElementById('nombre').value.trim();
        const apellido = document.getElementById('apellido').value.trim();
        const email = document.getElementById('correo').value.trim();
        const telefono = document.getElementById('telefono').value.trim();
        const password = document.getElementById('password').value;
        const confirmar = document.getElementById('confirmar').value;
        const id_rol = document.getElementById('id_rol').value;
        const id_estado = document.getElementById('id_estado').value || '1';

        // Validaciones simples
        if (!nombre || !apellido || !email || !password || !confirmar) {
          alert('Por favor completa todos los campos requeridos.');
          return;
        }

        if (password !== confirmar) {
          alert('Las contraseñas no coinciden.');
          return;
        }

        const payload = {
          nombre,
          apellido,
          email,
          password,
          telefono: telefono || null,
          id_rol: Number(id_rol),
          id_estado: Number(id_estado),
          url_foto: null
        };

        try {
          const res = await fetch('/api/v1/usuarios', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await res.json();

          if (res.status === 201) {
            // Registro exitoso: redirigir al login o mostrar mensaje
            alert('Registro exitoso. Por favor inicia sesión.');
            window.location.href = '/login';
          } else {
            const msg = data.message || data.error || JSON.stringify(data);
            alert('Error al registrar: ' + msg);
          }
        } catch (err) {
          console.error('Error en petición de registro', err);
          alert('Ocurrió un error al comunicarse con el servidor.');
        }
      });
    })();
  </script>
</body>
</html>
